version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hms
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5434:5432"
    command: postgresql -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 4G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: hms-pgbouncer
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hms
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
    ports:
      - "6432:5432"
    depends_on:
      - postgres

volumes:
  postgres_data:
